<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CHOPR Publications Database</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      line-height: 1.5;
      color: #222;
      background: #fafafa;
    }

    h1 { margin-bottom: 5px; }

    .subtitle {
      color: #555;
      margin-bottom: 25px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 180px 220px 260px;
      gap: 10px;
      margin-bottom: 15px;
    }

    input, select {
      padding: 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
    }

    .count {
      margin-bottom: 20px;
      font-weight: bold;
    }

    .pub {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .citation {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 8px;
    }

    .meta {
      color: #555;
      margin-top: 6px;
      font-size: 14px;
    }

    .warning {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    a { color: #005ea8; }

    @media (max-width: 900px) {
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <h1>CHOPR Publications Database</h1>

  <div class="subtitle">
    Searchable database of publications produced by the Center for Health Outcomes and Policy Research (CHOPR).
    Currently includes publications tracked in 2025 and 2026. Historical publications will be added over time.
  </div>

  <div class="controls">
    <input type="text" id="searchBox" placeholder="Search by author, title, citation, PMCID, URL, or keyword...">
    <select id="yearFilter">
      <option value="">All years</option>
    </select>
    <select id="statusFilter">
      <option value="">All statuses</option>
    </select>
    <select id="typeFilter">
      <option value="">All publication types</option>
    </select>
  </div>

  <div class="count" id="count">Loading publications...</div>
  <div id="message"></div>
  <div id="results"></div>

  <script>
    const files = [
      { year: "2025", path: "publications_2025.csv" },
      { year: "2026", path: "publications_2026.csv" }
    ];

    let publications = [];

    function clean(value) {
      return value ? String(value).trim() : "";
    }

    function escapeHTML(text) {
      return clean(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function makeLinksLive(text) {
      const safeText = escapeHTML(text);
      const urlRegex = /(https?:\/\/[^\s<]+|www\.[^\s<]+)/g;

      return safeText.replace(urlRegex, function(url) {
        let cleanUrl = url.replace(/[.,;)]$/, "");
        let punctuation = url.slice(cleanUrl.length);
        let href = cleanUrl.startsWith("http") ? cleanUrl : "https://" + cleanUrl;

        return `<a href="${href}" target="_blank" rel="noopener noreferrer">${cleanUrl}</a>${punctuation}`;
      });
    }

    function normalizeUrl(url) {
      url = clean(url);
      if (!url) return "";
      return url.startsWith("http") ? url : "https://" + url;
    }

    function get(row, possibleNames) {
      for (const name of possibleNames) {
        if (row[name] !== undefined) return clean(row[name]);
      }
      return "";
    }

    function loadCSV(file) {
      return new Promise((resolve) => {
        Papa.parse(file.path, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            const rows = results.data.map(row => ({
              year: file.year,
              faculty: get(row, ["Primary CHOPR Author/Contact - FACULTY LIST - USE DROP DOWN LIST"]),
              fellow: get(row, ["Primary CHOPR Author/Contact - FELLOWS - USE DROP DOWN LIST"]),
              citation: get(row, ["Publication Title/Citation (RA from Tues/Thurs Meeting Announcements- Jan 2025 to present)"]),
              date: get(row, ["Date of Acceptance (Tues mtg agenda date)"]),
              status: get(row, ["Current Status (accepted or published - please use drop down)"]),
              type: get(row, ["Publication Type (Academic Journal Article; Media Op-Ed, etc.)-- Use drop down list"]),
              pmcid: get(row, ["PMCID (non-journal = N/A)"]),
              url: get(row, ["Once published, URL to a) PMC version or b) if not NIH, URL to journal site (RA)"])
            })).filter(pub => pub.citation);

            resolve(rows);
          },
          error: function(error) {
            console.error("Error loading CSV:", file.path, error);
            resolve([]);
          }
        });
      });
    }

    function populateFilters() {
      const years = [...new Set(publications.map(p => p.year).filter(Boolean))].sort().reverse();
      const statuses = [...new Set(publications.map(p => p.status).filter(Boolean))].sort();
      const types = [...new Set(publications.map(p => p.type).filter(Boolean))].sort();

      addOptions("yearFilter", years);
      addOptions("statusFilter", statuses);
      addOptions("typeFilter", types);
    }

    function addOptions(elementId, values) {
      const select = document.getElementById(elementId);

      values.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
    }

    function renderResults() {
      const query = document.getElementById("searchBox").value.toLowerCase();
      const year = document.getElementById("yearFilter").value;
      const status = document.getElementById("statusFilter").value;
      const type = document.getElementById("typeFilter").value;

      const filtered = publications.filter(pub => {
        const searchable = [
          pub.year,
          pub.faculty,
          pub.fellow,
          pub.citation,
          pub.date,
          pub.status,
          pub.type,
          pub.pmcid,
          pub.url
        ].join(" ").toLowerCase();

        const matchesSearch = searchable.includes(query);
        const matchesYear = !year || pub.year === year;
        const matchesStatus = !status || pub.status === status;
        const matchesType = !type || pub.type === type;

        return matchesSearch && matchesYear && matchesStatus && matchesType;
      });

      document.getElementById("count").textContent =
        `${filtered.length} publication${filtered.length === 1 ? "" : "s"} shown out of ${publications.length} loaded`;

      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      if (filtered.length === 0) {
        resultsDiv.innerHTML = `<div class="warning">No publications match your current search/filter.</div>`;
        return;
      }

      filtered.forEach(pub => {
        const div = document.createElement("div");
        div.className = "pub";

        const liveCitation = makeLinksLive(pub.citation);
        const liveUrl = normalizeUrl(pub.url);

        div.innerHTML = `
          <div class="citation">${liveCitation}</div>

          <div class="meta">
            <strong>Year:</strong> ${escapeHTML(pub.year) || "N/A"} |
            <strong>Status:</strong> ${escapeHTML(pub.status) || "N/A"} |
            <strong>Type:</strong> ${escapeHTML(pub.type) || "N/A"}
          </div>

          <div class="meta">
            <strong>Faculty Contact:</strong> ${escapeHTML(pub.faculty) || "N/A"} |
            <strong>Fellow Contact:</strong> ${escapeHTML(pub.fellow) || "N/A"}
          </div>

          <div class="meta">
            <strong>Date:</strong> ${escapeHTML(pub.date) || "N/A"} |
            <strong>PMCID:</strong> ${escapeHTML(pub.pmcid) || "N/A"}
          </div>

          ${
            liveUrl
              ? `<div class="meta"><a href="${liveUrl}" target="_blank" rel="noopener noreferrer">View publication</a></div>`
              : ""
          }
        `;

        resultsDiv.appendChild(div);
      });
    }

    async function init() {
      const allRows = await Promise.all(files.map(loadCSV));
      publications = allRows.flat();

      if (publications.length === 0) {
        document.getElementById("count").textContent = "0 publications shown";
        document.getElementById("message").innerHTML =
          `<div class="warning">
            No publications loaded. Make sure <strong>publications_2025.csv</strong>
            and <strong>publications_2026.csv</strong> are in the same <strong>docs</strong>
            folder as <strong>index.html</strong>.
          </div>`;
        return;
      }

      publications.sort((a, b) => b.year.localeCompare(a.year));
      populateFilters();
      renderResults();
    }

    document.getElementById("searchBox").addEventListener("input", renderResults);
    document.getElementById("yearFilter").addEventListener("change", renderResults);
    document.getElementById("statusFilter").addEventListener("change", renderResults);
    document.getElementById("typeFilter").addEventListener("change", renderResults);

    init();
  </script>
</body>
</html>
