<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CHOPR Publications Database</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 40px;
    color: #222;
    background: #f7f7f7;
}

.header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.header img {
    height: 90px;
    max-width: 260px;
    object-fit: contain;
}

.header-text h1 {
    margin: 0;
}

.header-text p {
    margin: 5px 0 0 0;
    color: #666;
}

.subtitle {
    margin-bottom: 20px;
    color: #555;
}

.stats {
    font-weight: bold;
    margin-bottom: 20px;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 180px 220px 250px;
    gap: 10px;
    margin-bottom: 20px;
}

input,
select {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

.pub {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 15px;
}

.citation {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 10px;
}

.meta {
    color: #555;
    margin-top: 6px;
    font-size: 14px;
}

.button {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 12px;
    background: #005ea8;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}

.button:hover {
    background: #00457c;
}

.warning {
    background: #fff3cd;
    border: 1px solid #ffeeba;
    border-radius: 6px;
    padding: 12px;
}

a {
    color: #005ea8;
}

@media (max-width: 900px) {
    .controls {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="header">
    <img src="./images/CHOPR_logo.png" alt="CHOPR Logo">

    <div class="header-text">
        <h1>CHOPR Publications Database</h1>
        <p>Center for Health Outcomes and Policy Research</p>
    </div>
</div>

<div class="subtitle">
    Searchable database of CHOPR publications. Currently includes publications tracked in 2025 and 2026. Historical publications will be added over time.
</div>

<div class="stats" id="stats">
    Loading publications...
</div>

<div class="controls">
    <input type="text"
           id="searchBox"
           placeholder="Search by author, title, citation, PMCID, URL, or keyword...">

    <select id="yearFilter">
        <option value="">All Years</option>
    </select>

    <select id="statusFilter">
        <option value="">All Statuses</option>
    </select>

    <select id="typeFilter">
        <option value="">All Publication Types</option>
    </select>
</div>

<div id="results"></div>

<script>

const files = [
    { year: "2025", path: "publications_2025.csv" },
    { year: "2026", path: "publications_2026.csv" }
];

let publications = [];

function clean(value) {
    return value ? String(value).trim() : "";
}

function get(row, names) {
    for (const name of names) {
        if (row[name] !== undefined) {
            return clean(row[name]);
        }
    }
    return "";
}

function normalizeUrl(url) {
    url = clean(url);

    if (!url) return "";

    if (url.startsWith("http")) {
        return url;
    }

    return "https://" + url;
}

function makeLinks(text) {
    if (!text) return "";

    return text.replace(
        /(https?:\/\/[^\s]+|www\.[^\s]+)/g,
        function(url) {
            let cleanUrl = url.replace(/[.,;)]$/, "");
            let punctuation = url.slice(cleanUrl.length);
            let href = cleanUrl;

            if (!href.startsWith("http")) {
                href = "https://" + href;
            }

            return `<a href="${href}" target="_blank" rel="noopener noreferrer">${cleanUrl}</a>${punctuation}`;
        }
    );
}

function loadCSV(file) {
    return new Promise((resolve) => {
        Papa.parse(file.path, {
            download: true,
            header: true,
            skipEmptyLines: true,

            complete: function(results) {
                const rows = results.data.map(row => ({
                    year: file.year,

                    faculty: get(row, [
                        "Primary CHOPR Author/Contact - FACULTY LIST - USE DROP DOWN LIST"
                    ]),

                    fellow: get(row, [
                        "Primary CHOPR Author/Contact - FELLOWS - USE DROP DOWN LIST"
                    ]),

                    allAuthors: get(row, [
                        "All CHOPR Authors (Last name only)"
                    ]),

                    citation: get(row, [
                        "Publication Title/Citation (RA from Tues/Thurs Meeting Announcements- Jan 2025 to present)",
                        "Publication Title/Citation (RA from Tues/Thurs Meeting Announcements- Jan 2026 to present)"
                    ]),

                    date: get(row, [
                        "Date of Acceptance (Tues mtg agenda date)"
                    ]),

                    status: get(row, [
                        "Current Status (accepted or published - please use drop down)"
                    ]),

                    type: get(row, [
                        "Publication Type (Academic Journal Article; Media Op-Ed, etc.)-- Use drop down list"
                    ]),

                    pmcid: get(row, [
                        "PMCID (non-journal = N/A)",
                        "PMCID"
                    ]),

                    url: get(row, [
                        "Once published, URL to a) PMC version or b) if not NIH, URL to journal site (RA)"
                    ])

                })).filter(pub => pub.citation);

                resolve(rows);
            },

            error: function() {
                resolve([]);
            }
        });
    });
}

function populateFilters() {
    const years =
        [...new Set(publications.map(p => p.year))]
        .sort()
        .reverse();

    const statuses =
        [...new Set(publications.map(p => p.status).filter(Boolean))]
        .sort();

    const types =
        [...new Set(publications.map(p => p.type).filter(Boolean))]
        .sort();

    addOptions("yearFilter", years);
    addOptions("statusFilter", statuses);
    addOptions("typeFilter", types);
}

function addOptions(id, values) {
    const select = document.getElementById(id);

    values.forEach(value => {
        const option = document.createElement("option");

        option.value = value;
        option.textContent = value;

        select.appendChild(option);
    });
}

function renderResults() {
    const query =
        document.getElementById("searchBox")
        .value
        .toLowerCase();

    const year =
        document.getElementById("yearFilter").value;

    const status =
        document.getElementById("statusFilter").value;

    const type =
        document.getElementById("typeFilter").value;

    const filtered = publications.filter(pub => {
        const searchable = [
            pub.year,
            pub.faculty,
            pub.fellow,
            pub.allAuthors,
            pub.citation,
            pub.status,
            pub.type,
            pub.pmcid,
            pub.url
        ].join(" ").toLowerCase();

        return (
            searchable.includes(query) &&
            (!year || pub.year === year) &&
            (!status || pub.status === status) &&
            (!type || pub.type === type)
        );
    });

    document.getElementById("stats").textContent =
        `${filtered.length} publications shown • ${publications.length} total loaded`;

    const results = document.getElementById("results");
    results.innerHTML = "";

    if (filtered.length === 0) {
        results.innerHTML =
            `<div class="warning">
                No publications match your current search.
            </div>`;

        return;
    }

    filtered.forEach(pub => {
        const div = document.createElement("div");

        div.className = "pub";

        const liveCitation =
            makeLinks(pub.citation);

        const publicationUrl =
            normalizeUrl(pub.url);

        div.innerHTML = `
            <div class="citation">
                ${liveCitation}
            </div>

            <div class="meta">
                <strong>Year:</strong> ${pub.year || "N/A"} |
                <strong>Status:</strong> ${pub.status || "N/A"} |
                <strong>Type:</strong> ${pub.type || "N/A"}
            </div>

            <div class="meta">
                <strong>Faculty:</strong> ${pub.faculty || "N/A"} |
                <strong>Fellow:</strong> ${pub.fellow || "N/A"}
            </div>

            ${
                pub.allAuthors
                ?
                `<div class="meta">
                    <strong>All CHOPR Authors:</strong> ${pub.allAuthors}
                </div>`
                :
                ""
            }

            <div class="meta">
                <strong>Date:</strong> ${pub.date || "N/A"} |
                <strong>PMCID:</strong> ${pub.pmcid || "N/A"}
            </div>

            ${
                publicationUrl
                ?
                `<a class="button"
                    href="${publicationUrl}"
                    target="_blank"
                    rel="noopener noreferrer">
                    View Publication
                </a>`
                :
                ""
            }
        `;

        results.appendChild(div);
    });
}

async function init() {
    const data =
        await Promise.all(files.map(loadCSV));

    publications =
        data.flat();

    if (publications.length === 0) {
        document.getElementById("results").innerHTML =
            `<div class="warning">
                No publication data could be loaded. Confirm that publications_2025.csv and publications_2026.csv are in the same docs folder as index.html.
            </div>`;

        document.getElementById("stats").textContent =
            "0 publications loaded";

        return;
    }

    populateFilters();
    renderResults();
}

document.getElementById("searchBox")
    .addEventListener("input", renderResults);

document.getElementById("yearFilter")
    .addEventListener("change", renderResults);

document.getElementById("statusFilter")
    .addEventListener("change", renderResults);

document.getElementById("typeFilter")
    .addEventListener("change", renderResults);

init();

</script>

</body>
</html>
