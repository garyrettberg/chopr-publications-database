<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CHOPR Publications Database</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      line-height: 1.5;
      color: #222;
      background: #fafafa;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .count {
      margin-bottom: 20px;
      font-weight: bold;
    }

    .pub {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .citation {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 8px;
    }

    .meta {
      color: #555;
      margin-top: 6px;
      font-size: 14px;
    }

    a {
      color: #005ea8;
    }
  </style>
</head>

<body>
  <h1>CHOPR Publications Database</h1>

  <div class="subtitle">
    Searchable database of CHOPR publications, currently including 2025 and 2026 records.
  </div>

  <input
    type="text"
    id="searchBox"
    placeholder="Search by author, title, citation, year, status, PMCID, or publication type..."
  >

  <div class="count" id="count">Loading publications...</div>

  <div id="results"></div>

  <script>
    const files = [
      { year: "2025", path: "../data/publications_2025.csv" },
      { year: "2026", path: "../data/publications_2026.csv" }
    ];

    let publications = [];

    function clean(value) {
      return value ? String(value).trim() : "";
    }

    function get(row, possibleNames) {
      for (const name of possibleNames) {
        if (row[name] !== undefined) {
          return clean(row[name]);
        }
      }
      return "";
    }

    function loadCSV(file) {
      return new Promise((resolve) => {
        Papa.parse(file.path, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            const rows = results.data.map(row => ({
              year: file.year,
              faculty: get(row, [
                "Primary CHOPR Author/Contact - FACULTY LIST - USE DROP DOWN LIST"
              ]),
              fellow: get(row, [
                "Primary CHOPR Author/Contact - FELLOWS - USE DROP DOWN LIST"
              ]),
              citation: get(row, [
                "Publication Title/Citation (RA from Tues/Thurs Meeting Announcements- Jan 2025 to present)"
              ]),
              date: get(row, [
                "Date of Acceptance (Tues mtg agenda date)"
              ]),
              status: get(row, [
                "Current Status (accepted or published - please use drop down)"
              ]),
              type: get(row, [
                "Publication Type (Academic Journal Article; Media Op-Ed, etc.)-- Use drop down list"
              ]),
              pmcid: get(row, [
                "PMCID (non-journal = N/A)"
              ]),
              url: get(row, [
                "Once published, URL to a) PMC version or b) if not NIH, URL to journal site (RA)"
              ])
            })).filter(pub => pub.citation);

            resolve(rows);
          },
          error: function(error) {
            console.error("Error loading CSV:", file.path, error);
            resolve([]);
          }
        });
      });
    }

    function renderResults() {
      const query = document.getElementById("searchBox").value.toLowerCase();

      const filtered = publications.filter(pub => {
        const searchable = [
          pub.year,
          pub.faculty,
          pub.fellow,
          pub.citation,
          pub.date,
          pub.status,
          pub.type,
          pub.pmcid,
          pub.url
        ].join(" ").toLowerCase();

        return searchable.includes(query);
      });

      document.getElementById("count").textContent =
        `${filtered.length} publication${filtered.length === 1 ? "" : "s"} shown`;

      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      filtered.forEach(pub => {
        const div = document.createElement("div");
        div.className = "pub";

        div.innerHTML = `
          <div class="citation">${pub.citation}</div>

          <div class="meta">
            <strong>Year:</strong> ${pub.year || "N/A"} |
            <strong>Status:</strong> ${pub.status || "N/A"} |
            <strong>Type:</strong> ${pub.type || "N/A"}
          </div>

          <div class="meta">
            <strong>Faculty Contact:</strong> ${pub.faculty || "N/A"} |
            <strong>Fellow Contact:</strong> ${pub.fellow || "N/A"}
          </div>

          <div class="meta">
            <strong>Date:</strong> ${pub.date || "N/A"} |
            <strong>PMCID:</strong> ${pub.pmcid || "N/A"}
          </div>

          ${pub.url ? `<div class="meta"><a href="${pub.url}" target="_blank">View publication</a></div>` : ""}
        `;

        resultsDiv.appendChild(div);
      });
    }

    async function init() {
      const allRows = await Promise.all(files.map(loadCSV));
      publications = allRows.flat();

      publications.sort((a, b) => {
        return b.year.localeCompare(a.year);
      });

      renderResults();
    }

    document.getElementById("searchBox").addEventListener("input", renderResults);

    init();
  </script>
</body>
</html>
